:root{
  --bg:#053A22;--surface:#0B4C2D;--surface2:#125E39;--line:#237A4E;
  --ink:#FFFFFF;--muted:#BFE0CC;--on-y:#05301A;
  --y:#FFDF00;--y-t:rgba(255,223,0,.13);
  --g:#5BE08A;--g-card:#137042;--b:#7DB8FF;--m:#FF9EC4;--m-t:rgba(255,158,196,.17);
  --display:"Rattani",-apple-system,system-ui,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);
  --rail:56px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--sans);padding-left:calc(var(--rail) + 18px + var(--safe-l));padding-bottom:calc(28px + var(--safe-b));overscroll-behavior-y:none}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--y);outline-offset:2px;border-radius:6px}
.statusbg{position:fixed;inset:0 0 auto 0;height:var(--safe-t);background:var(--bg);z-index:30}
main{padding:calc(var(--safe-t) + 12px) 14px 24px 0;max-width:640px;margin:0 auto}
h1,h2,h3,.grp,.card.g .t,.driver .nm{font-family:var(--display);font-weight:400;font-synthesis:none;margin:0;letter-spacing:.01em}

.dot.g{background:var(--g)}.dot.b{background:var(--b)}.dot.y{background:var(--y)}.dot.m{background:var(--m)}.dot.n{background:var(--line)}

/* day */
.daystrip{position:sticky;top:var(--safe-t);z-index:20;margin:0 -14px 0 0;padding:8px 14px 8px 0;background:var(--bg);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}

.chipday.today:not([aria-current=true]){border-color:var(--y)}

function mapsHref(p){
  const q=encodeURIComponent(dname(p)+' '+(p.address&&p.kind!=='x'?p.address:'')+' Rio de Janeiro');

function catOf(p){
  const t=asc(p.type||'');
  if(/samba|party|bar\b|venue/.test(t)) return 'Night';
  if(/market|shop|neighborhood|folk|shopping/.test(t)) return 'Walks and shopping';
  if(/museum|gallery|library|arts|art |showroom/.test(t+' ')) return 'Art and culture';
  if(/landmark|viewpoint|stairs/.test(t)) return 'Sights';
  return 'Outdoors';
}
const CATS=['Sights','Outdoors','Art and culture','Walks and shopping','Night'];
function renderExplore(){
  const e=state.exp2;
  const n=P.filter(p=>p.kind==='do'&&p.status!=='dropped').length;
  return `<div class="pagehead"><h1>Things to do</h1><p>${n} ideas, ordered by the day they’re planned</p></div>
  <input class="search" id="q-do" type="search" placeholder="Search by name or place" value="${esc(e.q)}" autocomplete="off">
  ${chipsRow([['','All'],['plan','In the plan'],['idea','Not placed yet']],e.view,'exp2.view')}
  ${chipsRow([['','Any kind']].concat(CATS.map(c=>[c,c])),e.cat,'exp2.cat')}
  <label class="sel">Open on <select id="sel-do">${dayOptions(e.open)}</select></label>
  <div id="res-do"></div>`;
}
function exploreResults(){
  const e=state.exp2; const q=asc(e.q);
  let l=P.filter(p=>p.kind==='do'&&p.status!=='dropped');
  if(q) l=l.filter(p=>asc(p.name+' '+(p.area||'')+' '+(p.type||'')).includes(q));
  if(e.view==='plan') l=l.filter(p=>planOf[p.id]);
  if(e.view==='idea') l=l.filter(p=>!planOf[p.id]);
  if(e.cat) l=l.filter(p=>catOf(p)===e.cat);
  const od=e.open!==''?DAYS[+e.open]:null;
  if(od) l=l.filter(p=>openOn(p,od.dow)!==false);
  const dayOf=p=>planOf[p.id]?planOf[p.id][0].day:99;
  l.sort((a,b)=>dayOf(a)-dayOf(b)||dname(a).localeCompare(dname(b)));
  if(!l.length) return `<div class="empty">Nothing matches. Loosen a filter.</div>`;
  let h='',g=null;
  const dropped=P.filter(p=>p.kind==='do'&&p.status==='dropped');
  l.forEach(p=>{
    const di=dayOf(p), key=di===99?'Not placed yet':`${DAYS[di].name} ${MONTHDAY(DAYS[di])}`;
    if(key!==g){g=key;h+=`<div class="grp">${esc(key)}</div>`}
    const pl=planOf[p.id]; const st=!pl?'n':(pl.some(x=>x.status==='g')?'g':'b');
    const hrs=openOn(p,'Mon')===undefined?'':'';
    let sub=[cleanMeta(p.type,26),p.need?cleanMeta(p.need,16):'',p.area?cleanMeta(p.area,20):''].filter(Boolean).join(' · ');
    if(od&&openOn(p,od.dow)===null) sub+=' · hours unknown';
    h+=`<button class="item" data-act="open" data-pid="${p.id}"><i class="dot ${st}"></i><div><div class="t">${esc(dname(p))}</div><div class="s">${esc(sub)}</div></div><div class="r">${esc(/^free/i.test(p.cost||'')?'Free':'')}</div></button>`;
  });
  if(!e.view&&!e.cat&&!q&&!od) h+=`<details style="margin-top:22px"><summary class="muted" style="font-size:14px;padding:8px 0">Dropped (${dropped.length})</summary>${dropped.map(p=>`<div class="item" style="opacity:.6"><i class="dot n"></i><div><div class="t">${esc(dname(p))}</div><div class="s">${esc(p.notes||'')}</div></div><div></div></div>`).join('')}</details>`;
  return h;
}

const AREAS=[
 ['Copacabana and Leme',/copacabana|leme/],
 ['Ipanema and Arpoador',/ipanema|arpoador/],
 ['Leblon and Gávea',/leblon|gavea/],
 ['Botafogo, Flamengo and Glória',/botafogo|urca|flamengo|gloria|catete/],
 ['Jardim Botânico, Lagoa and Humaitá',/jardim botanico|lagoa|humaita/],
 ['Santa Teresa',/santa teresa/],
 ['Centro, Lapa and the port',/centro|lapa|saude|gamboa|santo cristo|pier/],
 ['Laranjeiras and Cosme Velho',/laranjeiras|cosme velho/],
 ['Tijuca and the forest',/tijuca|alto da boa|corcovado/]
];
const AREA_ORDER=AREAS.map(a=>a[0]).concat(['Further out']);
function areaOf(p){const t=asc((p.area||'')+' '+(p.hood||'')); for(const [n,re] of AREAS) if(re.test(t)) return n; return 'Further out'}
function hoursNote(p){
  if(p.status==='dropped') return '';
  if(p.open&&p.open.length<7) return 'Closed '+DOWS.filter(d=>!p.open.includes(d)).join(', ');
  if(p.open) return 'Open every day';
  return p.hours?'Hours unverified':'';
}
function guideTag(p){
  const m=p.michelin||''; if(!m) return '';
  if(/2 stars/.test(m)) return 'Michelin 2 stars'; if(/1 star/.test(m)) return 'Michelin 1 star';
  if(/bib/i.test(m)) return 'Bib Gourmand'; if(/recommended/i.test(m)) return 'Michelin recommended'; return '';
}
function planText(p){const pl=planOf[p.id]; return pl?'Planned '+pl.slice(0,2).map(x=>SHORT[x.day]+' '+MONTHDAY(DAYS[x.day])+' '+SLOTNAME[x.slot].toLowerCase()).join(', '):''}
function groupBy(list,keyFn,order){
  const m=new Map(); list.forEach(p=>{const k=keyFn(p); if(!m.has(k)) m.set(k,[]); m.get(k).push(p)});
  const ord=k=>{const i=order.indexOf(k);return i<0?99:i};
  return [...m.entries()].sort((a,b)=>(ord(a[0])-ord(b[0]))||a[0].localeCompare(b[0])).map(([k,v])=>[k,v.sort((x,y)=>dname(x).localeCompare(dname(y)))]);
}
const DAYKEYS=DAYS.map(d=>d.name+' '+MONTHDAY(d));
function mealGroup(p){
  const m=asc(p.meal||''), first=m.split('/')[0].trim();
  const B=/breakfast|brunch/.test(m),C=/cafe|sweet/.test(m),L=/lunch|snack|market/.test(m),D=/dinner/.test(m),R=/\bbar\b|night/.test(m);
  if(/^(bar|night)/.test(first)) return 'Bars and nights out';
  if(!D&&!L&&(B||C)) return 'Breakfast, coffee and sweets';
  if(!D&&!L&&R) return 'Bars and nights out';
  if(L&&D) return 'Lunch or dinner';
  if(D) return 'Dinner'; if(L) return 'Lunch'; return 'Other';
}
const MEAL_ORDER=['Breakfast, coffee and sweets','Lunch','Lunch or dinner','Dinner','Bars and nights out','Other'];
function guideGroup(p){const g=guideTag(p); return g||'Not on the guide'}
const GUIDE_ORDER=['Michelin 2 stars','Michelin 1 star','Bib Gourmand','Michelin recommended','Not on the guide'];
function planGroup(p){const pl=planOf[p.id]; if(!pl) return 'Not in the plan yet'; return pl.some(x=>x.status==='g')?'Genevieve’s choice':'In the plan as an option'}
function actDay(p){ if(p.status==='dropped') return 'Dropped'; const pl=planOf[p.id]; return pl?DAYKEYS[pl[0].day]:'Not placed yet' }
function actStatus(p){ if(p.status==='dropped') return 'Dropped'; const pl=planOf[p.id]; if(!pl) return 'Not placed yet'; return pl.some(x=>x.status==='g')?'Genevieve’s choice':'Suggestions in the plan' }
const STATUS_ORDER=['Genevieve’s choice','Suggestions in the plan','Not placed yet','Dropped','In the plan as an option','Not in the plan yet'];
function allRow(p,reasons){
  const pl=planOf[p.id]; const st=(p.status==='dropped'||!pl)?'n':(pl.some(x=>x.status==='g')?'g':'b');
  const s1=p.kind==='eat'?[p.cuisine?cleanMeta(p.cuisine,34):'',p.area?cleanMeta(p.area,24):'',p.rating?'★ '+p.rating:''].filter(Boolean).join(' · ')
    :[p.type?cleanMeta(p.type,26):'',p.need?cleanMeta(p.need,16):'',p.area?cleanMeta(p.area,24):''].filter(Boolean).join(' · ');
  const s2=[reasons||'',hoursNote(p),p.kind==='eat'?guideTag(p):'',planText(p),p.status==='dropped'&&p.notes?p.notes:''].filter(Boolean).join(' · ');
  const r=p.kind==='eat'?(p.price||''):(/^free/i.test(p.cost||'')?'Free':'');
  return `<button class="item" data-act="open" data-pid="${p.id}" style="${p.status==='dropped'?'opacity:.72':''}"><i class="dot ${st}"></i><div><div class="t">${esc(dname(p))}</div><div class="s">${esc(s1)}</div>${s2?`<div class="s">${esc(s2)}</div>`:''}</div><div class="r">${esc(r)}</div></button>`;
}
function groupHTML(view,gname,items,sub){
  const A=state.all, key=view+':'+gname; const open=A.q||A.openAll||A.open[key];
  return `<details class="g" data-k="${esc(key)}" ${open?'open':''}><summary class="gsum"><span class="grp gn">${esc(gname)}</span><span class="gcount">${sub||items.length}</span></summary><div class="gbody">${items.map(p=>allRow(p)).join('')}</div></details>`;
}
function verifyItems(){
  const out=[];
  P.forEach(p=>{
    if(p.status==='dropped') return;
    const inPlan=!!planOf[p.id]||p.status==='g'; if(!inPlan) return;
    const r=[];
    if(p.open===null||p.open===undefined) { if(p.hours||p.kind==='eat') r.push('Hours unverified') }
    if(/confirm|best guess|not verified|verify|check before|not picked/i.test(p.notes||'')) r.push('Check notes');
    if(p.kind==='do'&&/not verified|verify/i.test(p.cost||'')) r.push('Price unverified');
    if(r.length) out.push([p,r]);
  });
  return out;
}
function renderAll(){
  const A=state.all; const nE=P.filter(p=>p.kind==='eat').length, nD=P.filter(p=>p.kind==='do').length;
  const nv=verifyItems().length;
  let h=`<div class="pagehead"><h1>Everything</h1><p>All ${nE} places to eat and all ${nD} things to do from your sheet, including the dropped ones</p></div>
  <div class="seg four" role="group">${[['dining','Dining'],['acts','Activities'],['areas','By area'],['verify','Verify '+nv]].map(([v,l])=>`<button data-act="allview" data-v="${v}" aria-pressed="${A.view===v}">${l}</button>`).join('')}</div>`;
  if(A.view!=='verify') h+=`<input class="search" id="q-all" type="search" placeholder="${A.view==='areas'?'Search everything':'Search this list'}" value="${esc(A.q)}" autocomplete="off">`;
  if(A.view==='dining') h+=`<div class="sel">Group by</div>`+chipsRow([['area','Area'],['meal','Meal'],['price','Price'],['guide','Guide'],['plan','Plan']],A.dg,'all.dg');
  if(A.view==='acts') h+=`<div class="sel">Group by</div>`+chipsRow([['day','Day'],['kind','Kind'],['area','Area'],['status','Status']],A.ag,'all.ag');
  if(A.view==='verify') h+=`<p class="muted" style="margin:10px 0 0">Things already in your plan that still need a second look: unverified hours, unconfirmed names, or unchecked prices.</p>`;
  h+=`<div id="res-all"></div>`;
  return h;
}
function countLine(t){return `<div class="countline"><span>${t}</span><button data-act="expandall">${state.all.openAll?'Collapse all':'Expand all'}</button></div>`}
function allResults(){
  const A=state.all, q=asc(A.q);
  const hit=p=>!q||asc([p.name,p.cuisine,p.type,p.area,p.hood,p.address,p.notes].filter(Boolean).join(' ')).includes(q);
  if(A.view==='dining'){
    const L=P.filter(p=>p.kind==='eat'&&hit(p)); if(!L.length) return '<div class="empty">Nothing matches.</div>';
    const f={area:[areaOf,AREA_ORDER],meal:[mealGroup,MEAL_ORDER],price:[p=>p.price||'No price listed',['$','$$','$$$','$$$$','No price listed']],guide:[guideGroup,GUIDE_ORDER],plan:[planGroup,STATUS_ORDER]}[A.dg];
    return countLine(L.length+' places')+groupBy(L,f[0],f[1]).map(([k,v])=>groupHTML('d'+A.dg,k,v)).join('');
  }
  if(A.view==='acts'){
    const L=P.filter(p=>p.kind==='do'&&hit(p)); if(!L.length) return '<div class="empty">Nothing matches.</div>';
    const f={day:[actDay,DAYKEYS.concat(['Not placed yet','Dropped'])],kind:[p=>p.status==='dropped'?'Dropped':catOf(p),CATS.concat(['Dropped'])],area:[areaOf,AREA_ORDER],status:[actStatus,STATUS_ORDER]}[A.ag];
    return countLine(L.length+' things to do')+groupBy(L,f[0],f[1]).map(([k,v])=>groupHTML('a'+A.ag,k,v)).join('');
  }
  if(A.view==='areas'){
    const L=P.filter(hit); if(!L.length) return '<div class="empty">Nothing matches.</div>';
    const m=groupBy(L,areaOf,AREA_ORDER);
    return countLine('Nearest the hotel first')+m.map(([k,v])=>{
      const e=v.filter(p=>p.kind==='eat'), d=v.filter(p=>p.kind==='do');
      const key='ar:'+k, open=A.q||A.openAll||A.open[key];
      return `<details class="g" data-k="${esc(key)}" ${open?'open':''}><summary class="gsum"><span class="grp gn">${esc(k)}</span><span class="gcount">${e.length} eat, ${d.length} do</span></summary><div class="gbody">${d.length?`<div class="sublab">Things to do</div>${d.map(p=>allRow(p)).join('')}`:''}${e.length?`<div class="sublab">Places to eat</div>${e.map(p=>allRow(p)).join('')}`:''}</div></details>`;
    }).join('');
  }
  // verify
  const V=verifyItems(); if(!V.length) return '<div class="empty">Nothing to verify.</div>';
  const order=['Hours unverified','Check notes','Price unverified'];
  const buckets={}; V.forEach(([p,r])=>r.forEach(x=>(buckets[x]=buckets[x]||[]).push(p)));
  const label={'Hours unverified':'Hours not verified','Check notes':'Read the note first','Price unverified':'Price or tickets not verified'};
  return order.filter(k=>buckets[k]).map(k=>{
    const items=buckets[k].sort((a,b)=>dname(a).localeCompare(dname(b)));
    return `<details class="g" data-k="v:${k}" open><summary class="gsum"><span class="grp gn">${label[k]}</span><span class="gcount">${items.length}</span></summary><div class="gbody">${items.map(p=>allRow(p)).join('')}</div></details>`;
  }).join('');
}

/* ---------- sheet ---------- */
function nearbyPlaces(p){
  const out=[];
  if(p.kind==='do'&&p.nearby){
    const n=asc(p.nearby);
    P.forEach(q=>{ if(q.kind!=='eat') return; const key=asc(dname(q)).replace(/[^a-z0-9 ]/g,'').trim(); if(key.length>=4&&n.includes(key.split(' ').slice(0,2).join(' '))) out.push(q) });
  } else if(p.kind==='eat'){
    const key=asc(dname(p)).replace(/[^a-z0-9 ]/g,'').trim().split(' ').slice(0,2).join(' ');
    P.forEach(q=>{ if(q.kind==='do'&&q.status!=='dropped'&&q.nearby&&key.length>=4&&asc(q.nearby).includes(key)) out.push(q) });
  }
  return out.slice(0,6);
}

   <button class="btn alt wide" data-act="closesheet" style="margin-top:18px;width:100%">Close</button>`;

function bindGrab(){
  const g=$('#grab'),sh=$('#sheet'); let y0=null,dy=0;
  g.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;dy=0;sh.style.transition='none'},{passive:true});

  g.addEventListener('touchend',()=>{sh.style.transition='';sh.style.transform='';if(dy>90)closeSheet()});
}

}
function setTab(t,opts){state.tab=t;store.set('tab',t);render(false)}
function goDay(i,slot){
  state.day=Math.max(0,Math.min(DAYS.length-1,+i)); state.tab='day'; closeSheet(); render(false);
  if(slot){const el=document.getElementById('slot-'+slot); if(el) setTimeout(()=>{const y=el.getBoundingClientRect().top+window.scrollY-70;window.scrollTo({top:y,behavior:'smooth'})},30)}
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
async function offlineStatus(){
  const els=[$('#offl'),$('#offl2')].filter(Boolean); if(!els.length) return;
  let msg;
  if(location.protocol==='file:') msg='Running from a file. It works offline; hosting it adds Add to Home Screen.';
  else if(!('serviceWorker' in navigator)) msg='Offline saving isn’t supported in this browser.';
  else {
    try{ const keys=await caches.keys(); const ok=keys.some(k=>k.startsWith('rio-itinerary')); msg=ok?`Saved for offline. Version ${BUILD}.`:'Not saved for offline yet. Stay on wifi and reopen once.' }catch(e){ msg='Offline status unavailable.' }
  }
  els.forEach(e=>e.textContent=msg);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) { if(e.target.id==='scrim') closeSheet(); return }
  const a=el.dataset.act;
  if(a==='tab') setTab(el.dataset.tab);
  else if(a==='day') { state.day=+el.dataset.i; if(state.tab!=='day'){state.tab='day'} render(false) }
  else if(a==='open') openSheet(el.dataset.pid,el.dataset.day);
  else if(a==='closesheet') closeSheet();
  else if(a==='goday') goDay(el.dataset.i,el.dataset.slot);
  else if(a==='pin'){ togglePick(el.dataset.key,el.dataset.id); render(true) }
  else if(a==='more'){ state.exp[el.dataset.ek]=!state.exp[el.dataset.ek]; render(true) }
  else if(a==='dec'){ const m=store.get('dec',{}); m[el.dataset.id]=!m[el.dataset.id]; store.set('dec',m); render(true) }
  else if(a==='todo'){ const m=store.get('todo',{}); m[el.dataset.id]=!m[el.dataset.id]; store.set('todo',m); render(true) }
  else if(a==='bookview'){ state.tripView=el.dataset.v; render(true) }
  else if(a==='maps'){ store.set('maps',el.dataset.v); render(true) }
  else if(a==='chip'){
    const [g,f]=el.dataset.f.split('.'); let v=el.dataset.v; if(v==='true')v=true; else if(v==='false')v=false;
    if(g==='all'){ state.all[f]=v; state.all.open={}; render(true) }
    else { state[g==='eat'?'eat':'exp2'][f]=(state[g==='eat'?'eat':'exp2'][f]===v&&typeof v==='string'&&v!=='')?'':v; render(true) }
  }
  else if(a==='allview'){ state.all.view=el.dataset.v; state.all.q=''; render(false) }
  else if(a==='expandall'){ state.all.openAll=!state.all.openAll; if(!state.all.openAll) state.all.open={}; render(true) }
  else if(a==='findeat'){ state.eat={q:'',meal:el.dataset.meal,zone:'',price:'',open:String(el.dataset.i),noreset:false,plan:false}; setTab('eat') }
  else if(a==='driver'){ const p=byId[el.dataset.pid]; openDriver(dname(p),p.address,p.area) }
  else if(a==='driverhotel'){ openDriver(HOTEL.name,HOTEL.address,'Copacabana',true) }
  else if(a==='closedriver') closeDriver();
  else if(a==='refresh'){ toast('Checking…'); (async()=>{try{const r=await navigator.serviceWorker.getRegistration(); if(r) await r.update(); const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); location.reload()}catch(err){toast('No connection. Your saved copy still works.')}})() }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q-eat'){state.eat.q=e.target.value;$('#res-eat').innerHTML=eatResults()}
  if(e.target.id==='q-all'){state.all.q=e.target.value;$('#res-all').innerHTML=allResults();fixHeads($('#res-all'))}
  if(e.target.id==='q-do'){state.exp2.q=e.target.value;$('#res-do').innerHTML=exploreResults()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='sel-eat'){state.eat.open=e.target.value;$('#res-eat').innerHTML=eatResults()}
  if(e.target.id==='sel-do'){state.exp2.open=e.target.value;$('#res-do').innerHTML=exploreResults()}
});
// swipe days
let sx=null,sy=null;
document.addEventListener('touchstart',e=>{ if(state.tab!=='day'||state.sheet!=null||e.target.closest('.daystrip')) {sx=null;return} sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2){ const n=state.day+(dx<0?1:-1); if(n>=0&&n<DAYS.length){state.day=n;render(false)} } });
document.addEventListener('toggle',e=>{const d=e.target; if(d&&d.tagName==='DETAILS'&&d.dataset.k&&!state.all.q){state.all.open[d.dataset.k]=d.open}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeDriver()}});

/* ---------- boot ---------- */
(function init(){
  document.body.insertAdjacentHTML('afterbegin',`<div class="statusbg"></div>`);
  document.body.insertAdjacentHTML('beforeend',`<main id="view"></main>
   <div class="scrim" id="scrim"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Place details"></div>
   <div class="driver" id="driver" role="dialog" aria-modal="true" aria-label="Driver card"></div><div class="toast" id="toast" role="status"></div>
   <nav class="tabs" aria-label="Sections">${[['trip','Trip'],['day','Day'],['eat','Eat'],['explore','Explore'],['all','All'],['book','Book']].map(([k,l])=>`<button data-act="tab" data-tab="${k}" aria-label="${l}" aria-current="false">${ICON[k]}<span>${l}</span></button>`).join('')}</nav>`);
  const t=todayIdx();
  if(t.idx>=0){state.tab='day';state.day=t.idx}
  else state.tab='trip';
  render(false);
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').then(()=>setTimeout(offlineStatus,1500)).catch(()=>{});
  }
})();
})();

</script>
</body>
</html>
